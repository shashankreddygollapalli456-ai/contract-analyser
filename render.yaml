services:
  # 1. API Gateway (Public-facing Router)
  - type: web
    name: gateway
    env: node
    rootDir: gateway
    buildCommand: npm install
    startCommand: node src/index.js
    port: 4000
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # User will provide MongoDB Atlas URI
      - key: AUDIT_SERVICE_URL
        value: http://audit-service:4008
      - key: NOTIFICATION_SERVICE_URL
        value: http://notification-service:4007
      - key: CONTRACT_SERVICE_URL
        value: http://contract-service:4002
      - key: AI_SERVICE_URL
        value: http://ai-service:4003
      - key: RISK_SERVICE_URL
        value: http://risk-compliance-service:4004
      - key: BIDDING_SERVICE_URL
        value: http://bidding-service:4009

  # 2. Frontend React Application
  - type: web
    name: frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set during build to the Gateway URL (e.g. https://gateway-xxxx.onrender.com/api)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Auth Service
  - type: web
    name: auth-service
    env: node
    rootDir: services/auth-service
    buildCommand: npm install --production
    startCommand: node src/index.js
    port: 4001
    envVars:
      - key: PORT
        value: 4001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: gateway
          envVar: JWT_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: gateway
          envVar: JWT_REFRESH_SECRET

  # 4. Contract Service
  - type: web
    name: contract-service
    env: node
    rootDir: services/contract-service
    buildCommand: npm install --production
    startCommand: node src/index.js
    port: 4002
    envVars:
      - key: PORT
        value: 4002
      - key: MONGO_URI
        sync: false

  # 5. AI Service
  - type: web
    name: ai-service
    env: node
    rootDir: services/ai-service
    buildCommand: npm install --production
    startCommand: node src/index.js
    port: 4003
    envVars:
      - key: PORT
        value: 4003
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

  # 6. Risk and Compliance Service
  - type: web
    name: risk-compliance-service
    env: node
    rootDir: services/risk-compliance-service
    buildCommand: npm install --production
    startCommand: node src/index.js
    port: 4004
    envVars:
      - key: PORT
        value: 4004
      - key: MONGO_URI
        sync: false

  # 7. Chat Service
  - type: web
    name: chat-service
    env: node
    rootDir: services/chat-service
    buildCommand: npm install --production
    startCommand: node src/index.js
    port: 4005
    envVars:
      - key: PORT
        value: 4005
      - key: MONGO_URI
        sync: false

  # 8. Report Service
  - type: web
    name: report-service
    env: node
    rootDir: services/report-service
    buildCommand: npm install --production
    startCommand: node src/index.js
    port: 4006
    envVars:
      - key: PORT
        value: 4006
      - key: MONGO_URI
        sync: false

  # 9. Notification Service
  - type: web
    name: notification-service
    env: node
    rootDir: services/notification-service
    buildCommand: npm install --production
    startCommand: node src/index.js
    port: 4007
    envVars:
      - key: PORT
        value: 4007
      - key: MONGO_URI
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # 10. Audit Service
  - type: web
    name: audit-service
    env: node
    rootDir: services/audit-service
    buildCommand: npm install --production
    startCommand: node src/index.js
    port: 4008
    envVars:
      - key: PORT
        value: 4008
      - key: MONGO_URI
        sync: false

  # 11. Bidding Service (Python)
  - type: web
    name: bidding-service
    env: python
    rootDir: services/bidding-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT src.main:app
    port: 4009
    envVars:
      - key: PORT
        value: 4009
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
